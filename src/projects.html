<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>semiotic systems: projects</title>
  <style>
    body {
      background: #f8f6f0;
      color: #2c2c2c;
      font-family: serif;
      line-height: 1.6;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    .container {
      flex: 1;
      margin: 0 auto;
      max-width: 800px;
      padding: 20px;
    }

    .header {
      border-bottom: 3px solid #8b4513;
      margin-bottom: 30px;
      padding-bottom: 30px;
    }

    .domain {
      color: #8b4513;
      font-family: monospace;
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 1px;
    }

    a {
      color: #8b4513;
      text-decoration: none;
    }

    a:hover {
      font-weight: bold;
    }

    main {
      margin: 20px 0;
    }

    .note {
      background: rgba(139, 69, 19, 0.05);
      font-size: 18px;
      line-height: 1.7;
      margin: 40px 0;
      padding: 25px;
    }

    .footer {
      color: #999;
      font-family: monospace;
      font-size: 12px;
      margin-top: auto;
      text-align: center;
    }

    .line {
      width: 100px;
      height: 2px;
      background: #8b4513;
      margin: 40px auto;
    }

    .semiotics-symbol {
      color: #8b4513;
      font-family: monospace;
      font-size: 24px;
      opacity: 0.3;
      position: absolute;
      right: 20px;
      top: 20px;
    }

    .domain a:hover {
      font-weight: inherit;
    }

    /* All sections share one grid, via subgrid, so that columns line up
       across sections, not just within each one. */
    .project-directory {
      column-gap: 20px;
      display: grid;
      grid-template-columns: max-content 1fr max-content;
      margin: 40px 0;
      row-gap: 40px;
    }

    .project-section {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: subgrid;
    }

    .project-section h2 {
      grid-column: 1 / -1;
      color: #8b4513;
      font-size: 20px;
      font-weight: normal;
      margin: 0 0 10px 0;
    }

    .projects {
      background: rgba(139, 69, 19, 0.05);
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: subgrid;
      list-style: none;
      margin: 0;
      padding: 10px 20px;
    }

    .project {
      align-items: baseline;
      border-bottom: 1px solid rgba(139, 69, 19, 0.15);
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: subgrid;
      padding: 6px 0;
    }

    .project:last-child {
      border-bottom: none;
    }

    .project-name {
      font-family: monospace;
      font-size: 16px;
      grid-column: 1;
    }

    .project-desc {
      font-size: 16px;
      grid-column: 2;
    }

    .project-source {
      font-family: monospace;
      font-size: 12px;
      grid-column: 3;
    }

    .project-source a {
      color: #999;
    }

    /* Mobile styles */
    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }

      .domain {
        font-size: 20px;
        letter-spacing: 0.5px;
      }

      .note {
        font-size: 18px;
        line-height: 1.6;
        margin: 30px 0;
        padding: 20px;
      }

      .semiotics-symbol {
        font-size: 20px;
        right: 15px;
        top: 15px;
      }

      .header {
        margin-bottom: 25px;
        padding-bottom: 25px;
      }

      .line {
        margin: 30px auto;
        width: 80px;
      }
    }

    @media (max-width: 480px) {
      .project-directory {
        grid-template-columns: 1fr max-content;
      }

      .projects {
        padding: 5px 15px;
      }

      .project-desc {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .project-source {
        grid-column: 2;
        grid-row: 1;
      }

      .container {
        padding: 10px;
      }

      .domain {
        font-size: 18px;
        letter-spacing: 0px;
      }

      .note {
        font-size: 17px;
        line-height: 1.5;
        margin: 25px 0;
        padding: 15px;
      }

      .semiotics-symbol {
        font-size: 18px;
        right: 10px;
        top: 10px;
      }

      .header {
        margin-bottom: 20px;
        padding-bottom: 20px;
      }

      .line {
        margin: 25px auto;
        width: 60px;
      }

      .footer {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="semiotics-symbol">⟨§⟩</div>

  <div class="container">
    <header class="header">
      <div class="domain"><a href="/">semiotic.systems</a>/projects</div>
    </header>

    <main>
      <div class="project-directory">
        <!-- PROJECTS -->
      </div>
      <div class="line"></div>
    </main>

    <footer class="footer">
      <p><a href="https://rjbs.cloud/">rjbs</a></p>
    </footer>
  </div>
</body>
</html>
